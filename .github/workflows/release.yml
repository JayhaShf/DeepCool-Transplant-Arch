name: release

# Binary releases contain DeepCool's extracted payload. Keep public publishing
# disabled unless redistribution has been reviewed and approved.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, matching package.json (for example 0.1.2)'
        required: true
        default: '0.1.2'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.vars.outputs.version }}
    env:
      DC_SETUP_URL_1: 'https://deepcool.io/downloads/DeepCool-1.2.12-setup.exe'
      DC_SETUP_URL_2: 'https://deepcool.omnictl.cn/downloads/DeepCool-1.2.12-setup.exe'
      DC_SETUP_SHA256: '4549885c716e951dde488e2117823478f7994c475e686331f93866582f6b116f'
      SEVENZIP_URL: 'https://www.7-zip.org/a/7z2602-linux-x64.tar.xz'
      SEVENZIP_SHA256: '41aaba7b1235304ab5aa0624530c67ae829496cd29e875925271efdccc28c03e'
      DISPATCH_VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Confirm binary redistribution approval
        env:
          ALLOW_BINARY_RELEASE: ${{ vars.ALLOW_BINARY_RELEASE }}
        run: |
          [ "$ALLOW_BINARY_RELEASE" = true ] || {
            echo "Binary publishing is disabled. Set the repository variable ALLOW_BINARY_RELEASE=true only after redistribution approval." >&2
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve and validate version
        id: vars
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$DISPATCH_VERSION"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version must be strict SemVer x.y.z: $VERSION" >&2
            exit 1
          }
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          PKGBUILD_VERSION="$(sed -n 's/^pkgver=//p' packaging/PKGBUILD)"
          [ "$VERSION" = "$PACKAGE_VERSION" ] || {
            echo "Tag/input $VERSION does not match package.json $PACKAGE_VERSION" >&2
            exit 1
          }
          [ "$VERSION" = "$PKGBUILD_VERSION" ] || {
            echo "package.json $VERSION does not match PKGBUILD $PKGBUILD_VERSION" >&2
            exit 1
          }
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_COMMIT="$(git rev-list -n 1 "refs/tags/v$VERSION" 2>/dev/null || true)"
            [ -n "$TAG_COMMIT" ] && [ "$TAG_COMMIT" = "$GITHUB_SHA" ] || {
              echo "workflow_dispatch must run from the commit tagged v$VERSION" >&2
              exit 1
            }
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install verified build tools
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 3 -o /tmp/7zz.tar.xz "$SEVENZIP_URL"
          echo "$SEVENZIP_SHA256  /tmp/7zz.tar.xz" | sha256sum -c -
          mkdir -p /tmp/7zz
          tar -xf /tmp/7zz.tar.xz -C /tmp/7zz
          test -x /tmp/7zz/7zz
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd python3-pil python3-psutil python3-usb

      - name: Cache official setup exe
        id: cache-exe
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/dc-setup/DeepCool-1.2.12-setup.exe
          key: dc-setup-1.2.12-${{ env.DC_SETUP_SHA256 }}

      - name: Download verified official setup exe
        if: steps.cache-exe.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dc-setup"
          TARGET="$RUNNER_TEMP/dc-setup/DeepCool-1.2.12-setup.exe"
          ok=0
          for url in "$DC_SETUP_URL_1" "$DC_SETUP_URL_2"; do
            echo "trying $url"
            if curl -fsSL --retry 3 --retry-delay 3 -o "$TARGET.part" "$url" &&
               echo "$DC_SETUP_SHA256  $TARGET.part" | sha256sum -c -; then
              mv "$TARGET.part" "$TARGET"
              ok=1
              break
            fi
            rm -f "$TARGET.part"
          done
          [ "$ok" = 1 ] || { echo "Failed to download a verified setup exe" >&2; exit 1; }

      - name: Verify cached inputs
        run: |
          set -euo pipefail
          SETUP="$RUNNER_TEMP/dc-setup/DeepCool-1.2.12-setup.exe"
          echo "$DC_SETUP_SHA256  $SETUP" | sha256sum -c -
          /tmp/7zz/7zz l -ba "$SETUP" |
            awk '/app-64[.]7z/ { found=1 } END { exit !found }'

      - name: Cache Electron download
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/electron
          key: electron-23.3.13-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install locked build dependencies
        run: npm ci --no-audit --no-fund

      - name: Ensure verified Electron binary
        run: node node_modules/electron/install.js

      - name: Extract official payload
        env:
          ZIP_BIN: /tmp/7zz/7zz
        run: bash scripts/extract.sh "$RUNNER_TEMP/dc-setup/DeepCool-1.2.12-setup.exe"

      - name: Prepare Linux patches
        run: bash scripts/prepare.sh work/windows-app

      - name: Test patched compatibility layer
        run: npm test

      - name: Build release artifacts
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.version }}
        run: bash packaging/build-release.sh "$RELEASE_VERSION"

      - name: Smoke-check release artifacts
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          tar --zstd -tf "deepcool-linux-port-$RELEASE_VERSION.tar.zst" |
            awk -v expected="deepcool-linux-port-$RELEASE_VERSION/packaging/install-tarball.sh" \
              '$0 == expected { found=1 } END { exit !found }'
          tar --zstd -xOf "deepcool-linux-port-$RELEASE_VERSION.tar.zst" \
            "deepcool-linux-port-$RELEASE_VERSION/deepcool-linux-port.desktop" |
            awk '$0 == "Exec=/usr/bin/deepcool-linux-port" { found=1 } \
              END { exit !found }'
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' \
            "deepcool-linux-port-$RELEASE_VERSION-sbom.cdx.json"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ steps.vars.outputs.version }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/deepcool-linux-port-${{ steps.vars.outputs.version }}.tar.zst
            dist/deepcool-linux-port-${{ steps.vars.outputs.version }}-source.tar.zst
            dist/deepcool-linux-port-${{ steps.vars.outputs.version }}-sbom.cdx.json
            dist/PKGBUILD
            dist/deepcool-linux-port.install
            dist/SHA256SUMS

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Reconfirm binary redistribution approval
        env:
          ALLOW_BINARY_RELEASE: ${{ vars.ALLOW_BINARY_RELEASE }}
        run: |
          [ "$ALLOW_BINARY_RELEASE" = true ] || {
            echo "Binary publishing is disabled; refusing to upload release assets." >&2
            exit 1
          }

      - name: Download verified release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist

      - name: Verify release bundle
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Create non-overwriting release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace published assets" >&2
            exit 1
          fi
          NOTES_FILE="$(mktemp)"
          trap 'rm -f "$NOTES_FILE"' EXIT
          cat > "$NOTES_FILE" <<EOF
          ## DeepCool Linux Port $RELEASE_VERSION

          Arch Linux x86_64 compatibility port with a bundled Electron 23 runtime.

          Verify downloads with \`SHA256SUMS\`. The CycloneDX SBOM inventories the
          bundled Node.js components. The binary archive includes the /opt installer:

          \`sudo bash deepcool-linux-port-$RELEASE_VERSION/packaging/install-tarball.sh deepcool-linux-port-$RELEASE_VERSION\`

          The binary contains DeepCool's extracted payload. Redistribution requires
          separate authorization from the relevant copyright holders.
          EOF
          gh release create "$TAG" \
            dist/deepcool-linux-port-$RELEASE_VERSION.tar.zst \
            dist/deepcool-linux-port-$RELEASE_VERSION-source.tar.zst \
            dist/deepcool-linux-port-$RELEASE_VERSION-sbom.cdx.json \
            dist/PKGBUILD \
            dist/deepcool-linux-port.install \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "DeepCool Linux Port $RELEASE_VERSION" \
            --notes-file "$NOTES_FILE"
