name: release

# 触发：
#   - 推送 tag v*   （自动构建并发布 GitHub Release）
#   - 手动 workflow_dispatch（填版本号）
#
# 构建流程：从 DeepCool 官网下载 DeepCool-1.2.12-setup.exe（官方源）
# → 解包 → 应用 Linux 补丁 → packaging/build-release.sh 产出自包含二进制 tar
# + 源码 tar → 上传 GitHub Releases。
#
# 注意：二进制包内含 DeepCool 官方解包素材与 Electron 运行时（约 543M），
# 发布前请自行评估版权（README「勿再分发官方 payload」）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 0.1.0）'
        required: true
        default: '0.1.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # 官方直链（cn.deepcool.com 下载页 API：download-path?version=1.2.12&name=deep-creative）
      DC_SETUP_URL_1: 'https://deepcool.io/downloads/DeepCool-1.2.12-setup.exe'
      DC_SETUP_URL_2: 'https://deepcool.omnictl.cn/downloads/DeepCool-1.2.12-setup.exe'
      # 本地 exe 校验和（构建前强制校验，防篡改/防错误版本）
      DC_SETUP_SHA256: '4549885c716e951dde488e2117823478f7994c475e686331f93866582f6b116f'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install build tools (7zz official + zstd)
        run: |
          set -euo pipefail
          # Ubuntu p7zip(16.02) 解 DeepCool NSIS 会对部分 mp4 报 Data Error；
          # 改用 7-Zip 官方静态二进制（7zz，本机 Arch 同源）。
          curl -fsSL --retry 3 -o /tmp/7zz.tar.xz \
            'https://www.7-zip.org/a/7z2602-linux-x64.tar.xz'
          mkdir -p /tmp/7zz
          tar -xf /tmp/7zz.tar.xz -C /tmp/7zz
          mkdir -p /tmp/7zz/bin
          ln -sf /tmp/7zz/7zz /tmp/7zz/bin/7z
          echo "/tmp/7zz/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          echo "7zz version:"
          /tmp/7zz/7zz 2>&1 | head -1 || true

      - name: Verify official 7zz present
        run: |
          set -euo pipefail
          test -x /tmp/7zz/7zz
          /tmp/7zz/7zz 2>&1 | head -1
          command -v 7z || true

      # ---- 官方安装包：缓存 + 下载 + 校验 ----
      - name: Cache official setup exe
        id: cache-exe
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dc-setup/DeepCool-1.2.12-setup.exe
          key: dc-setup-1.2.12-${{ env.DC_SETUP_SHA256 }}

      - name: Download official setup exe from DeepCool
        if: steps.cache-exe.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dc-setup"
          ok=0
          for url in "$DC_SETUP_URL_1" "$DC_SETUP_URL_2"; do
            echo "trying $url"
            if curl -fsSL --retry 3 --retry-delay 3 -o "$RUNNER_TEMP/dc-setup/DeepCool-1.2.12-setup.exe" "$url"; then
              ok=1
              break
            fi
          done
          [ "$ok" = 1 ] || { echo "官网下载失败" >&2; exit 1; }
          cd "$RUNNER_TEMP/dc-setup"
          echo "$DC_SETUP_SHA256  DeepCool-1.2.12-setup.exe" | sha256sum -c -

      # ---- Electron 二进制缓存 ----
      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-23.3.13-${{ runner.os }}

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      # ---- 解包 + 打补丁（同本机 bootstrap 链路）----
      - name: Extract official payload
        env:
          # 显式指定官方 7zz，避免 PATH 命中 Ubuntu p7zip
          ZIP_BIN: /tmp/7zz/bin/7z
        run: bash scripts/extract.sh "$RUNNER_TEMP/dc-setup/DeepCool-1.2.12-setup.exe"

      - name: Prepare Linux patches
        run: bash scripts/prepare.sh work/windows-app

      # ---- 构建发布包 ----
      - name: Resolve version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          V="${V:-0.1.0}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version=$V"

      - name: Build release tarballs
        run: bash packaging/build-release.sh "${{ steps.vars.outputs.version }}"

      - name: List artifacts
        run: ls -lh dist/

      # ---- 上传 GitHub Release ----
      - name: Create/Update Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.version }}"
          TAG="v$VERSION"
          NOTES="## DeepCool Linux Port $VERSION

          - Arch Linux 移植：官方 Electron UI + Linux 传感器 + LM-Series LCD（Python daemon）
          - 二进制包为**自包含**：内含 Electron 23 与官方解包素材（约 543M），解压即用
          - 源码包（-source）为纯代码，供 PKGBUILD / 合规分发
          - 依赖：python-pyusb / python-psutil / python-pillow / acl / ffmpeg

          ### 使用
          \`\`\`bash
          tar --zstd -xf deepcool-linux-port-\$VERSION.tar.zst -C /tmp/dc
          /tmp/dc/deepcool-linux-port-\$VERSION/bin/deepcool-linux-port
          # 或安装 daemon + /opt + 菜单：
          #   sudo bash /tmp/dc/deepcool-linux-port-\$VERSION/packaging/install-tarball.sh /tmp/dc/deepcool-linux-port-\$VERSION
          \`\`\`

          > 版权：二进制含 DeepCool 官方素材与 Electron，请自行评估后再公开分发（README 声明「勿再分发官方 payload」）。"
          gh release create "$TAG" \
            dist/deepcool-linux-port-$VERSION.tar.zst \
            dist/deepcool-linux-port-$VERSION-source.tar.zst \
            --title "DeepCool Linux Port $VERSION" \
            --notes "$NOTES" \
            || gh release upload "$TAG" \
                 dist/deepcool-linux-port-$VERSION.tar.zst \
                 dist/deepcool-linux-port-$VERSION-source.tar.zst \
                 --clobber
          echo "Release: $TAG"
